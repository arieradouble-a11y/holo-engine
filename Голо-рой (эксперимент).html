<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Голо-рой · эксперимент</title>
<style>
  html,body{margin:0;height:100%;background:#03080e;overflow:hidden;font:13px 'Segoe UI',system-ui,sans-serif;color:#cfe9f7}
  #c{display:block;width:100vw;height:100vh;cursor:grab}
  #c:active{cursor:grabbing}
  #hud{position:fixed;left:16px;top:14px;z-index:5;user-select:none;pointer-events:none}
  #hud h1{font:600 14px 'Segoe UI';margin:0 0 2px;letter-spacing:.02em;color:#dff6ff}
  #hud .s{font:400 11px 'Segoe UI';color:#6f97ac;letter-spacing:.03em}
  #panel{position:fixed;right:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:9px;
    background:rgba(6,18,30,.55);border:1px solid rgba(56,232,255,.22);border-radius:12px;padding:12px 13px;backdrop-filter:blur(8px);min-width:210px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row label{font:500 11.5px 'Segoe UI';color:#bcdcec}
  .row input[type=range]{width:108px;accent-color:#38e8ff}
  .btn{cursor:pointer;font:600 11.5px 'Segoe UI';color:#dff6ff;background:rgba(6,18,30,.6);
    border:1px solid rgba(56,232,255,.3);border-radius:9px;padding:7px 11px;transition:.15s;text-align:center}
  .btn.off{color:#7fb3c8;border-color:rgba(56,232,255,.14)}
  .btn:hover{border-color:rgba(56,232,255,.6)}
  #err{position:fixed;left:16px;bottom:14px;color:#ff8f6b;font:12px monospace;z-index:9;white-space:pre-wrap}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1>Голо-рой · эксперимент</h1><div class="s">частицы как функция (позиция, время, seed) — по мотивам Casberry</div></div>
<div id="panel">
  <div class="btn" id="tSwarm">✦ Рой: ВКЛ</div>
  <div class="btn off" id="tWire">╱ Каркас: ВЫКЛ</div>
  <div class="btn" id="tSpin">↻ Вращение: ВКЛ</div>
  <div class="row"><label>Плотность</label><input id="sDens" type="range" min="8000" max="90000" step="2000" value="46000"></div>
  <div class="row"><label>Кружение</label><input id="sSwirl" type="range" min="0" max="100" value="42"></div>
  <div class="row"><label>Дыхание</label><input id="sBreath" type="range" min="0" max="100" value="35"></div>
  <div class="row"><label>Размер точки</label><input id="sSize" type="range" min="20" max="140" value="62"></div>
</div>
<div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script>
const errEl=document.getElementById('err');
window.addEventListener('error',e=>{errEl.textContent='ОШИБКА: '+(e.message||e.error);});
(function(){
if(!window.THREE){errEl.textContent='three.js не загрузился (нет сети до CDN?)';return;}
const T=THREE;
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new T.Scene();
// лёгкая радиальная подложка, как в движке
scene.background=(function(){const cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d');
  const g=x.createRadialGradient(256,300,10,256,300,360);g.addColorStop(0,'#0a2233');g.addColorStop(.5,'#061420');g.addColorStop(1,'#03080e');
  x.fillStyle=g;x.fillRect(0,0,512,512);return new T.CanvasTexture(cv);})();
const camera=new T.PerspectiveCamera(42,1,0.1,500);
const pivot=new T.Group();scene.add(pivot);

/* ---- процедурная ЖКХ-высотка (эхо нашего МКД): тонкие боксы -> ровные грани ---- */
/* собираем список {geo, mat, hot} и общий bbox */
const parts=[];
function box(sx,sy,sz,cx,cy,cz,hot){const g=new T.BoxGeometry(sx,sy,sz);g.translate(cx,cy,cz);parts.push({g,hot:hot?1:0});}
const floors=9,fh=2.75,sections=3,sw=7.0,D=12.0,winCols=7;
const W=sections*sw,H=floors*fh;
// плита-основание + кровля
box(W+1.2,0.5,D+1.2,0,-0.25,0,0);
box(W+0.8,0.5,D+0.8,0,H+0.25,0,0);
// перекрытия
for(let f=1;f<floors;f++) box(W,0.16,D,0,f*fh,0,0);
// углы/пилоны секций
for(let s=0;s<=sections;s++){const x=-W/2+s*sw;box(0.5,H,0.5,x,H/2,-D/2,0);box(0.5,H,0.5,x,H/2,D/2,0);}
box(W,H,0.4,0,H/2,-D/2,0);box(W,H,0.4,0,H/2,D/2,0);
box(0.4,H,D,-W/2,H/2,0,0);box(0.4,H,D,W/2,H/2,0,0);
// окна (тонкие рамки-ниши по фасаду)
for(let f=0;f<floors;f++)for(let s=0;s<sections;s++)for(let w=0;w<winCols;w++){
  const x=-W/2+s*sw+ (w+0.5)*(sw/winCols); const y=f*fh+fh*0.55;
  box(0.9,1.5,0.12,x,y,D/2+0.02,0); box(0.9,1.5,0.12,x,y,-D/2-0.02,0);
}
// инженерные стояки (ГОРЯЧИЕ -> янтарные искры): вертикальные трубы в ядре
for(let s=0;s<sections;s++){const x=-W/2+sw/2+s*sw;
  box(0.35,H,0.35,x,H/2,0,1); box(0.35,H,0.35,x+0.9,H/2,1.4,1);}
// разводка по подвалу
box(W*0.9,0.3,0.3,0,0.2,2.2,1); box(0.3,0.3,D*0.7,-W*0.3,0.2,0,1);

/* нормализация в куб ~ высотой 6 */
const bb=new T.Box3();const tmp=new T.Vector3();
parts.forEach(p=>{p.g.computeBoundingBox();bb.union(p.g.boundingBox);});
const size=new T.Vector3();bb.getSize(size);const cen=new T.Vector3();bb.getCenter(cen);
const scl=6.0/size.y;
const norm=v=>{v.set((v.x-cen.x)*scl,(v.y-bb.min.y)*scl,(v.z-cen.z)*scl);};
const BH=size.y*scl;

/* ---- каркас (EdgesGeometry) как референс нашего текущего рендера ---- */
const wirePos=[];
parts.forEach(p=>{const eg=new T.EdgesGeometry(p.g,24);const a=eg.attributes.position.array;
  for(let i=0;i<a.length;i+=3){tmp.set(a[i],a[i+1],a[i+2]);norm(tmp);wirePos.push(tmp.x,tmp.y,tmp.z);}eg.dispose();});
const wireGeo=new T.BufferGeometry();wireGeo.setAttribute('position',new T.Float32BufferAttribute(wirePos,3));
const wireMat=new T.LineBasicMaterial({color:0x38e8ff,transparent:true,opacity:0.28,blending:T.AdditiveBlending,depthWrite:false});
const wire=new T.LineSegments(wireGeo,wireMat);wire.visible=false;pivot.add(wire);

/* ---- РОЙ: сэмплируем точки по площади треугольников каждого бокса ---- */
/* храним target(xyz) + normal(xyz) + seed + hot. Позицию во времени крутит шейдер. */
function buildSwarm(count){
  // площадь по частям (для равномерного покрытия)
  const triList=[]; // {a,b,c, hot} в НОРМАЛИЗОВАННЫХ координатах, + нормаль
  let areaTot=0;
  parts.forEach(p=>{
    const g=p.g.index?p.g.toNonIndexed():p.g; const a=g.attributes.position.array;
    for(let i=0;i<a.length;i+=9){
      const A=new T.Vector3(a[i],a[i+1],a[i+2]),B=new T.Vector3(a[i+3],a[i+4],a[i+5]),C=new T.Vector3(a[i+6],a[i+7],a[i+8]);
      norm(A);norm(B);norm(C);
      const n=new T.Vector3().subVectors(B,A).cross(new T.Vector3().subVectors(C,A));
      const ar=n.length()*0.5; if(ar<1e-6)continue; n.normalize();
      triList.push({A,B,C,n,hot:p.hot,ar}); areaTot+=ar;
    }
    if(g!==p.g)g.dispose();
  });
  const pos=new Float32Array(count*3),nor=new Float32Array(count*3),seed=new Float32Array(count),hot=new Float32Array(count);
  let k=0;
  for(const tr of triList){
    let m=Math.max(1,Math.round(count*tr.ar/areaTot));
    for(let j=0;j<m&&k<count;j++){
      let u=Math.random(),v=Math.random(); if(u+v>1){u=1-u;v=1-v;}
      const x=tr.A.x+u*(tr.B.x-tr.A.x)+v*(tr.C.x-tr.A.x);
      const y=tr.A.y+u*(tr.B.y-tr.A.y)+v*(tr.C.y-tr.A.y);
      const z=tr.A.z+u*(tr.B.z-tr.A.z)+v*(tr.C.z-tr.A.z);
      pos[k*3]=x;pos[k*3+1]=y;pos[k*3+2]=z;
      nor[k*3]=tr.n.x;nor[k*3+1]=tr.n.y;nor[k*3+2]=tr.n.z;
      seed[k]=Math.random();hot[k]=tr.hot;k++;
    }
    if(k>=count)break;
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position',new T.BufferAttribute(pos.subarray(0,k*3),3));
  g.setAttribute('aNorm',new T.BufferAttribute(nor.subarray(0,k*3),3));
  g.setAttribute('aSeed',new T.BufferAttribute(seed.subarray(0,k),1));
  g.setAttribute('aHot',new T.BufferAttribute(hot.subarray(0,k),1));
  g.computeBoundingSphere();
  return g;
}

const uniforms={
  uTime:{value:0}, uProgress:{value:0}, uSwirl:{value:0.42}, uBreath:{value:0.35},
  uSize:{value:62}, uPix:{value:renderer.getPixelRatio()}, uScan:{value:0},
  uColor:{value:new T.Color(0x38e8ff)}, uHotCol:{value:new T.Color(0xff7a24)}
};
const vsh=`
  uniform float uTime,uProgress,uSwirl,uBreath,uSize,uPix,uScan;
  attribute vec3 aNorm; attribute float aSeed,aHot;
  varying float vSeed,vHot,vTw,vBand,vY;
  // дешёвый «завиток» вокруг цели: функция (target, time, seed) — суть Casberry-подхода
  vec3 curl(vec3 p,float t,float s){
    float a=sin(p.y*2.3+t*0.8+s*30.0)+0.5*sin(p.x*3.1-t*0.6+s*11.0);
    float b=cos(p.x*2.7-t*0.7+s*23.0)+0.5*cos(p.z*3.3+t*0.5+s*7.0);
    float c=sin(p.z*2.9+t*0.9+s*17.0)+0.5*sin(p.y*3.7-t*0.4+s*41.0);
    return vec3(a,b,c);
  }
  void main(){
    vSeed=aSeed; vHot=aHot; vY=position.y;
    float t=uTime;
    vec3 target=position;
    // сборка из сферического разлёта (как интро движка)
    float h1=fract(sin(aSeed*91.17)*43758.5453), h2=fract(sin(aSeed*45.23+1.0)*24634.63);
    float uu=h1*2.0-1.0, th=h2*6.2831, ss=sqrt(max(0.0,1.0-uu*uu));
    vec3 scat=target+vec3(cos(th)*ss,uu,sin(th)*ss)*3.4;
    vec3 base=mix(scat,target,smoothstep(0.0,1.0,uProgress));
    // живой дрейф вдоль поверхности + «дыхание» по нормали
    vec3 sw=curl(target,t,aSeed)*(0.045*uSwirl);
    float breath=sin(t*0.9+aSeed*20.0)*0.5+0.5;
    vec3 drift=sw + aNorm*breath*(0.09*uBreath);
    vec3 P=base+drift*smoothstep(0.2,1.0,uProgress);
    // мерцание + бегущая скан-полоса по высоте (как uScan в движке)
    vTw=0.55+0.45*sin(t*3.4+aSeed*40.0);
    vBand=smoothstep(0.35,0.0,abs(P.y-uScan));
    vec4 mv=modelViewMatrix*vec4(P,1.0);
    gl_Position=projectionMatrix*mv;
    float sz=uSize*(0.55+0.9*aHot)*(0.7+0.6*vTw);
    gl_PointSize=sz*uPix*(1.0/max(0.4,-mv.z))* (0.9+0.6*vBand);
  }`;
const fsh=`
  precision highp float;
  uniform vec3 uColor,uHotCol; uniform float uProgress;
  varying float vSeed,vHot,vTw,vBand,vY;
  void main(){
    vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
    if(r>0.25) discard;
    float core=smoothstep(0.25,0.0,r);          // мягкий круглый спрайт
    float halo=smoothstep(0.25,0.02,r)*0.5;
    vec3 col=mix(uColor,uHotCol,vHot);
    col+=vBand*vec3(0.25,0.35,0.4);
    float a=(core*0.9+halo)*(0.35+0.65*vTw)*uProgress;
    a*=mix(0.5,1.0,vHot+0.0)+vBand*0.6;
    gl_FragColor=vec4(col*(1.0+vBand*0.8+vHot*0.6),a);
  }`;
const swarmMat=new T.ShaderMaterial({uniforms,vertexShader:vsh,fragmentShader:fsh,
  transparent:true,depthTest:false,depthWrite:false,blending:T.AdditiveBlending});
let swarm=new T.Points(buildSwarm(46000),swarmMat);pivot.add(swarm);

/* ---- ground glow ---- */
(function(){const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');
  const g=x.createRadialGradient(128,128,4,128,128,128);g.addColorStop(0,'rgba(70,210,255,.5)');g.addColorStop(.4,'rgba(45,170,225,.15)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);
  const pl=new T.Mesh(new T.PlaneGeometry(BH*1.5,BH*1.5),new T.MeshBasicMaterial({map:new T.CanvasTexture(cv),transparent:true,depthWrite:false,blending:T.AdditiveBlending,opacity:.6}));
  pl.rotation.x=-Math.PI/2;pl.position.y=-0.04;pivot.add(pl);})();

/* ---- controls ---- */
let az=0.6,el=0.18,dist=Math.max(9,BH*2.2),spin=true,drag=false,px=0,py=0;
const tgt=new T.Vector3(0,BH*0.5,0);
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-px)*0.006;el+=(e.clientY-py)*0.005;el=Math.max(-0.4,Math.min(1.2,el));px=e.clientX;py=e.clientY;});
canvas.addEventListener('wheel',e=>{dist*=(1+Math.sign(e.deltaY)*0.08);dist=Math.max(4,Math.min(60,dist));e.preventDefault();},{passive:false});
const $=id=>document.getElementById(id);
$('sSwirl').oninput=e=>uniforms.uSwirl.value=e.target.value/100;
$('sBreath').oninput=e=>uniforms.uBreath.value=e.target.value/100;
$('sSize').oninput=e=>uniforms.uSize.value=+e.target.value;
$('sDens').oninput=e=>{const n=+e.target.value;pivot.remove(swarm);swarm.geometry.dispose();swarm=new T.Points(buildSwarm(n),swarmMat);pivot.add(swarm);t0=performance.now();};
$('tSwarm').onclick=e=>{swarm.visible=!swarm.visible;e.target.classList.toggle('off',!swarm.visible);e.target.textContent='✦ Рой: '+(swarm.visible?'ВКЛ':'ВЫКЛ');};
$('tWire').onclick=e=>{wire.visible=!wire.visible;e.target.classList.toggle('off',!wire.visible);e.target.textContent='╱ Каркас: '+(wire.visible?'ВКЛ':'ВЫКЛ');};
$('tSpin').onclick=e=>{spin=!spin;e.target.classList.toggle('off',!spin);e.target.textContent='↻ Вращение: '+(spin?'ВКЛ':'ВЫКЛ');};

function resize(){const w=canvas.clientWidth||innerWidth||1280,h=canvas.clientHeight||innerHeight||720;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas); // headless: viewport часто нулевой на старте
window.__sample=()=>{const gl=renderer.getContext(),w=canvas.width,h=canvas.height,px=new Uint8Array(4*w*h);
  gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);let lit=0,mb=0,cy=0,am=0;
  for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b=px[i+2],br=r+g+b;if(br>60)lit++;if(br>mb)mb=br;
    if(b>90&&g>70&&r<130&&br>120)cy++;if(r>150&&g>70&&b<100)am++;}const t=w*h;
  return{size:[w,h],litPct:+(100*lit/t).toFixed(1),cyanPct:+(100*cy/t).toFixed(2),amberPct:+(100*am/t).toFixed(3),maxBright:mb};};

window.__dbg=()=>({pts:swarm.geometry.attributes.position.count, visible:swarm.visible,
  bs:swarm.geometry.boundingSphere?{c:swarm.geometry.boundingSphere.center.toArray().map(n=>+n.toFixed(2)),r:+swarm.geometry.boundingSphere.radius.toFixed(2)}:null,
  camPos:camera.position.toArray().map(n=>+n.toFixed(2)), dist:+dist.toFixed(2), BH:+BH.toFixed(2),
  progress:+uniforms.uProgress.value.toFixed(2), size:uniforms.uSize.value, pix:uniforms.uPix.value,
  p0:[pivot.children.length], firstPt:[swarm.geometry.attributes.position.getX(0).toFixed(2),swarm.geometry.attributes.position.getY(0).toFixed(2),swarm.geometry.attributes.position.getZ(0).toFixed(2)]});
window.__step=(p,rotY)=>{uniforms.uProgress.value=(p==null?1:p);uniforms.uTime.value=performance.now()*0.001;
  if(rotY!=null)pivot.rotation.y=rotY;
  camera.position.set(tgt.x,tgt.y+Math.sin(el)*dist,tgt.z+Math.cos(el)*dist);camera.lookAt(tgt);
  renderer.render(scene,camera);return 'stepped p='+uniforms.uProgress.value;};
let t0=performance.now();
function frame(){requestAnimationFrame(frame);
  const t=performance.now()*0.001;uniforms.uTime.value=t;
  uniforms.uProgress.value=Math.min(1,(performance.now()-t0)/1200);
  uniforms.uScan.value=(t*0.35%1)*BH;
  if(spin&&!drag)az+=0.0028;
  pivot.rotation.y=az;
  camera.position.set(tgt.x,tgt.y+Math.sin(el)*dist,tgt.z+Math.cos(el)*dist);
  camera.lookAt(tgt);
  renderer.render(scene,camera);
}
frame();
window.__ok=true;
})();
</script>
</body></html>
