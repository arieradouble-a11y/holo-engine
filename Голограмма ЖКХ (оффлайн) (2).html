document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

c), B=this.place(ax,0,u*r1+tu*thick*0.4,v*r1+tv*thick*0.4,c), Cc=this.place(ax,0,u*r1-tu*thick*0.4,v*r1-tv*thick*0.4,c), E=this.place(ax,0,u*r0-tu*thick,v*r0-tv*thick,c);\n      this.seg(P,D,A,B,dir); this.seg(P,D,B,Cc,dir); this.seg(P,D,Cc,E,dir); this.seg(P,D,E,A,dir); }\n    this.ringLoop(P,D,ax,0,hubR,c,Math.max(10,Math.round(16*dens)),dir); }\n  eHelix(P,D,o){ this._emitColor=o.col||null; const turns=o.turns||6, R=o.R, h=o.h, axis=o.axis||'y', c=o.c, dir=o.dir, dens=this.dMul;\n    const N=Math.max(40,Math.round(turns*22*dens)); let prev=null;\n    for(let i=0;i<=N;i++){ const s=i/N; const ang=s*turns*6.2832, al=(s-0.5)*h; const p=this.place(axis,al,Math.cos(ang)*R,Math.sin(ang)*R,c); if(prev) this.seg(P,D,prev,p,dir); prev=p; } }\n  buildRing(P,D){ const b=this.curRing||{y:-1.85,s:1}; const rings=[[1.55,0.02,1400],[1.18,0.015,700],[0.82,0.012,500]]; rings.forEach(rg=>{ this.eTorus(P,D,{R:rg[0]*b.s,r:rg[1]*b.s,axis:'y',c:[0,b.y,0],n:Math.round(rg[2]*Math.min(1.6,b.s)),dir:[0,0,0]}); }); }\n\n  fTankV(P,D,c,r,hh,n,dir){ this.eCyl(P,D,{r,h:hh,axis:'y',c,n,dir,cap:0.1}); }\n  fTankH(P,D,c,r,hh,n,dir,axis){ this.eCyl(P,D,{r,h:hh,axis:axis||'z',c,n,dir,cap:0.14}); }\n  fBldg(P,D,c,w,hh,d,n,dir){ this.eBox(P,D,{w,h:hh,d,c,n,dir}); }\n  fStack(P,D,c,r,hh,n,dir){ this.eCyl(P,D,{r,h:hh,axis:'y',c,n,dir,cap:0.02}); }\n  fPump(P,D,c,n,dir){ this.eCyl(P,D,{r:0.18,h:0.4,axis:'y',c:[c[0],c[1]+0.18,c[2]],n:Math.round(n*0.6),dir}); this.eSphere(P,D,{r:0.22,c:[c[0],c[1]-0.12,c[2]],n:Math.round(n*0.4),dir}); }\n  fWheels(P,D,c,wr,track,zs,n,dir){ for(const z of zs)for(const sx of [-1,1]) this.eCyl(P,D,{r:wr,h:0.18,axis:'x',c:[c[0]+sx*track,c[1],c[2]+z],n,dir}); }\n\n  // ---- detailed vehicle helpers (wireframe, monochrome by default) ----\n  vWheel(P,D,c,R,hw,dir,col){ const o=col?{col}:{};\n    this.eCyl(P,D,Object.assign({r:R,h:hw*2,axis:'x',c,dir,cap:0},o));            // tread band\n    this.eTorus(P,D,Object.assign({R:R*0.96,r:hw*0.5,axis:'x',c,dir},o));          // rounded sidewall\n    this.eDisk(P,D,Object.assign({r:R*0.6,axis:'x',along:hw,c,dir},o));            // outer rim (rings+spokes)\n    this.eDisk(P,D,Object.assign({r:R*0.6,axis:'x',along:-hw,c,dir},o));           // inner rim\n    this.eCyl(P,D,Object.assign({r:R*0.17,h:hw*2.2,axis:'x',c,dir,cap:1},o)); }    // hub\n  vAxle(P,D,y,z,track,R,hw,dir,col){ this.vWheel(P,D,[track,y,z],R,hw,dir,col); this.vWheel(P,D,[-track,y,z],R,hw,dir,col); this.eCyl(P,D,Object.assign({r:R*0.12,h:track*2,axis:'x',c:[0,y,z],dir,cap:0},col?{col}:{})); }\n  vCab(P,D,cx,cy,cz,w,h,d,dir,col){ const o=col?{col}:{}; const c=[cx,cy,cz], fz=cz+d/2;\n    this.eBox(P,D,Object.assign({w,h,d,c,dir},o));                                              // shell\n    this.eBox(P,D,Object.assign({w:w*0.84,h:h*0.4,d:0.03,c:[cx,cy+h*0.17,fz],dir},o));          // windshield\n    this.eBox(P,D,Object.assign({w:0.03,h:h*0.32,d:d*0.46,c:[cx+w/2,cy+h*0.14,cz+d*0.05],dir},o)); // R window\n    this.eBox(P,D,Object.assign({w:0.03,h:h*0.32,d:d*0.46,c:[cx-w/2,cy+h*0.14,cz+d*0.05],dir},o)); // L window\n    this.eBox(P,D,Object.assign({w:w*0.72,h:h*0.24,d:0.04,c:[cx,cy-h*0.3,fz],dir},o));           // grille\n    this.eBox(P,D,Object.assign({w:w*1.02,h:0.1,d:0.13,c:[cx,cy-h*0.5,fz],dir},o));              // bumper\n    this.eSphere(P,D,Object.assign({r:0.07,c:[cx+w*0.36,cy-h*0.36,fz],dir},o));                  // headlight R\n    this.eSphere(P,D,Object.assign({r:0.07,c:[cx-w*0.36,cy-h*0.36,fz],dir},o));                  // headlight L\n    this.eBox(P,D,Object.assign({w:0.04,h:0.16,d:0.05,c:[cx+w/2+0.11,cy+h*0.2,fz-0.06],dir},o)); // mirror R\n    this.eBox(P,D,Object.assign({w:0.04,h:0.16,d:0.05,c:[cx-w/2-0.11,cy+h*0.2,fz-0.06],dir},o)); } // mirror L\n  vFrame(P,D,cz,len,ht,y,dir,col){ const o=col?{col}:{};\n    this.eBox(P,D,Object.assign({w:0.08,h:0.15,d:len,c:[ht,y,cz],dir},o));\n    this.eBox(P,D,Object.assign({w:0.08,h:0.15,d:len,c:[-ht,y,cz],dir},o));\n    const n=Math.max(3,Math.round(len/0.8)); for(let i=0;i<n;i++){ const z=cz-len/2+len*(i+0.5)/n; this.eBox(P,D,Object.assign({w:ht*2,h:0.07,d:0.08,c:[0,y,z],dir},o)); } }\n  vTank(P,D,c,r,h,axis,dir,col){ const o=col?{col}:{}; this.eCyl(P,D,Object.assign({r,h,axis,c,dir,cap:0.04},o));\n    const e=axis==='z'?[0,0,h/2]:axis==='x'?[h/2,0,0]:[0,h/2,0];\n    this.eSphere(P,D,Object.assign({r:r*0.95,c:[c[0]+e[0],c[1]+e[1],c[2]+e[2]],dir},o));\n    this.eSphere(P,D,Object.assign({r:r*0.95,c:[c[0]-e[0],c[1]-e[1],c[2]-e[2]],dir},o));\n    for(let i=-1;i<=1;i++){ const cc=[c[0]+e[0]*i*0.45,c[1]+e[1]*i*0.45,c[2]+e[2]*i*0.45]; this.eTorus(P,D,Object.assign({R:r*1.03,r:0.022,axis,c:cc,dir},o)); } }\n  vBoom(P,D,a,b,wsec,dir,col){ const o=col?{col}:{}; const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,mz=(a[2]+b[2])/2; const dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2]; const L=Math.hypot(dx,dy,dz);\n    const axis=Math.abs(dz)>=Math.abs(dx)&&Math.abs(dz)>=Math.abs(dy)?'z':(Math.abs(dy)>=Math.abs(dx)?'y':'x');\n    this.eBox(P,D,Object.assign({w:axis==='x'?L:wsec,h:axis==='y'?L:wsec,d:axis==='z'?L:wsec,c:[mx,my,mz],dir},o)); }\n\n  // ---- lofted curved-body helpers (escape the \"boxy\" look) ----\n  rrect(hw,hh,r,cy,seg){ seg=seg||4; const pts=[]; const cs=[[hw-r,hh-r],[-(hw-r),hh-r],[-(hw-r),-(hh-r)],[hw-r,-(hh-r)]]; const ar=[[0,1.5708],[1.5708,3.1416],[3.1416,4.7124],[4.7124,6.2832]];\n    for(let ci=0;ci<4;ci++){ for(let i=0;i<=seg;i++){ const t=ar[ci][0]+(ar[ci][1]-ar[ci][0])*i/seg; pts.push([cs[ci][0]+Math.cos(t)*r, cs[ci][1]+Math.sin(t)*r+cy]); } } return pts; }\n  eLoft(P,D,o){ this._emitColor=o.col||null; const S=o.sections,dir=o.dir,axis=o.axis||'z',c=o.c||[0,0,0],closed=o.closed!==false;\n    for(const s of S){ let prev=null,first=null; for(let i=0;i<s.pts.length;i++){ const p=this.place(axis,s.a,s.pts[i][0],s.pts[i][1],c); if(prev)this.seg(P,D,prev,p,dir); if(!first)first=p; prev=p; } if(closed&&prev&&first)this.seg(P,D,prev,first,dir); }\n    for(let i=0;i<S.length-1;i++){ const A=S[i],B=S[i+1],n=Math.min(A.pts.length,B.pts.length); for(let k=0;k<n;k++){ this.seg(P,D,this.place(axis,A.a,A.pts[k][0],A.pts[k][1],c),this.place(axis,B.a,B.pts[k][0],B.pts[k][1],c),dir); } } }\n  eArch(P,D,o){ this._emitColor=o.col||null; const c=o.c,R=o.R,wx=o.wx,dir=o.dir,a0=o.a0==null?0.15:o.a0,a1=o.a1==null?(Math.PI-0.15):o.a1,n=14;\n    for(const sx of [-1,1]){ let prev=null; for(let i=0;i<=n;i++){ const t=a0+(a1-a0)*i/n; const p=[c[0]+sx*wx,c[1]+Math.sin(t)*R,c[2]+Math.cos(t)*R]; if(prev)this.seg(P,D,prev,p,dir); prev=p; } }\n    for(let i=0;i<=n;i+=2){ const t=a0+(a1-a0)*i/n; this.seg(P,D,[c[0]-wx,c[1]+Math.sin(t)*R,c[2]+Math.cos(t)*R],[c[0]+wx,c[1]+Math.sin(t)*R,c[2]+Math.cos(t)*R],dir); } }\n\n  buildCatalog(){\n    const sgnX=m=>(x)=>[(x<0?-1:1)*m,0,0];\n    const sgnZ=m=>(x,y,z)=>[0,0,(z<0?-1:1)*m];\n    const C={mc:'Приборы учёта',va:'Запорная арматура',pu:'Насосное оборудование',he:'Теплоснабжение',wt:'Водоснабжение и канализация',el:'Электроснабжение',ve:'Коммунальная техника'};\n    const COL={or:[1.0,0.46,0.10], or2:[1.0,0.55,0.17], glass:[0.5,0.82,1.0], steel:[0.54,0.58,0.66], dark:[0.34,0.36,0.43], white:[0.85,0.9,0.96], yel:[1.0,0.82,0.22], tire:[0.32,0.34,0.4], hub:[0.74,0.77,0.84], light:[1.0,0.96,0.72], amber:[1.0,0.62,0.13], hose:[0.42,0.45,0.52]};\n    return [\n      { cat:C.mc, name:'Счётчик воды', intro:'Крыльчатый счётчик холодной воды', summary:'Прибор учёта воды. Поток вращает крыльчатку внутри, а счётный механизм переводит её обороты в кубометры. Нажмите на деталь, чтобы узнать подробнее.', parts:[\n        { name:'Корпус', desc:'Латунный корпус. Внутри движется вода и вращается крыльчатка. На корпусе отлита стрелка направления потока — счётчик нельзя ставить наоборот.', build:(P,D)=>{ const cy=[0,0,0];\n          this.eCyl(P,D,{r:0.5,h:1.55,axis:'x',c:cy,dir:[0,0,0]});\n          this.eCyl(P,D,{r:0.36,h:1.45,axis:'x',c:cy,dir:[0,0,0],cap:0});\n          for(let k=0;k<8;k++){ const a=k/8*6.2832,u=Math.cos(a)*0.5,v=Math.sin(a)*0.5; this.seg(P,D,this.place('x',-0.74,u,v,cy),this.place('x',0.74,u,v,cy),[0,0,0]); }\n          this.eTorus(P,D,{R:0.5,r:0.055,axis:'x',c:[-0.74,0,0],dir:[0,0,0]});\n          this.eTorus(P,D,{R:0.5,r:0.055,axis:'x',c:[0.74,0,0],dir:[0,0,0]});\n          this.eTorus(P,D,{R:0.5,r:0.04,axis:'x',c:[0,0,0],dir:[0,0,0]});\n          this.eCone(P,D,{r0:0.46,r1:0.34,h:0.34,axis:'y',c:[0,0.46,0],dir:[0,0,0]});\n          this._emitColor=[1.0,0.3,0.24]; const ay=0.52;\n          this.seg(P,D,[-0.3,ay,0.0],[0.24,ay,0.0],[0,0,0]);\n          this.seg(P,D,[0.24,ay,0.0],[0.12,ay,0.11],[0,0,0]);\n          this.seg(P,D,[0.24,ay,0.0],[0.12,ay,-0.11],[0,0,0]); this._emitColor=null;\n        } },\n        { name:'Присоединительные патрубки', desc:'Через них счётчик врезается в трубу: с одной стороны вода входит, с другой выходит.', build:(P,D)=>{ for(const sx of [-1,1]){\n          this.eCyl(P,D,{r:0.3,h:0.5,axis:'x',c:[sx*1.0,0,0],dir:sgnX(1.0)});\n          this.eHelix(P,D,{turns:7,R:0.31,h:0.42,axis:'x',c:[sx*1.2,0,0],dir:sgnX(1.0)});\n          this.eTorus(P,D,{R:0.3,r:0.03,axis:'x',c:[sx*1.42,0,0],dir:sgnX(1.0)});\n        } } },\n        { name:'Накидные гайки', desc:'Соединяют счётчик с трубой. С их помощью прибор снимают для поверки или замены.', build:(P,D)=>{ const steel=[0.62,0.8,0.92];\n          for(const sx of [-1,1]){ const cx=sx*1.46,R=0.42,hl=0.12; this._emitColor=steel;\n            const pa=[],pb=[]; for(let k=0;k<6;k++){ const a=k/6*6.2832+0.26,u=Math.cos(a)*R,v=Math.sin(a)*R; pa.push([cx-hl,u,v]); pb.push([cx+hl,u,v]); }\n            for(let k=0;k<6;k++){ const n=(k+1)%6; this.seg(P,D,pa[k],pa[n],sgnX(1.8)); this.seg(P,D,pb[k],pb[n],sgnX(1.8)); this.seg(P,D,pa[k],pb[k],sgnX(1.8)); }\n            this._emitColor=null;\n            this.eTorus(P,D,{R:0.3,r:0.045,axis:'x',c:[cx,0,0],dir:sgnX(1.8),col:steel});\n          }\n        } },\n        { name:'Счётный механизм', desc:'Циферблат с роликами. Считает, сколько кубометров воды прошло. Цифры на нём — это и есть ваши показания.', build:(P,D)=>{ const glass=[0.5,0.82,1.0],red= енные киловатт-часы и текущую нагрузку.', build:(P,D)=>{ this.eBox(P,D,{w:0.7,h:0.3,d:0.04,c:[0,0.35,0.29],n:1600,dir:[0,0,1.3]}); } },\n        { name:'Измерительный модуль', desc:'Электроника, которая измеряет ток и напряжение и вычисляет потреблённую энергию.', build:(P,D)=>{ this.eBox(P,D,{w:0.8,h:0.5,d:0.3,c:[0,-0.05,0],n:1800,dir:[0,0.4,1.0]}); } },\n        { name:'Клеммная колодка', desc:'Сюда подключают фазные и нулевой провода — вход из сети и выход к квартире.', build:(P,D)=>{ this.eBox(P,D,{w:0.8,h:0.28,d:0.3,c:[0,-0.62,0.05],n:1700,dir:[0,-1.3,0]}); } },\n        { name:'Пломбы', desc:'Защитные пломбы. Не дают вскрыть счётчик и вмешаться в учёт.', build:(P,D)=>{ this.eSphere(P,D,{r:0.06,c:[-0.35,-0.7,0.2],n:300,dir:[-1,-1,0.6]}); this.eSphere(P,D,{r:0.06,c:[0.35,-0.7,0.2],n:300,dir:[1,-1,0.6]}); } },\n      ]},\n      { cat:C.mc, name:'Газовый счётчик', intro:'Мембранный счётчик газа', cam:{r:7.4,ty:0.05}, summary:'Учитывает объём газа, прошедший к плите и котлу. Внутри газ перекачивают мембранные камеры. Нажмите на деталь.', parts:[\n        { name:'Корпус', desc:'Герметичный металлический корпус. Внутри — измерительные камеры с мембранами.', build:(P,D)=>{ this.eBox(P,D,{w:1.2,h:1.1,d:0.8,c:[0,-0.1,0],n:6000,dir:[0,0,0]}); } },\n        { name:'Измерительные камеры', desc:'Газ поочерёдно наполняет камеры и выталкивает мембраны — так отмеряются порции объёма.', build:(P,D)=>{ this.eDisk(P,D,{r:0.34,axis:'x',along:0,c:[-0.2,-0.1,0],n:1200,dir:[-1.3,0,0]}); this.eDisk(P,D,{r:0.34,axis:'x',along:0,c:[0.2,-0.1,0],n:1200,dir:[1.3,0,0]}); } },\n        { name:'Счётный механизм', desc:'Роликовое табло наверху. Переводит движение мембран в кубометры газа.', build:(P,D)=>{ this.eBox(P,D,{w:0.6,h:0.26,d:0.4,c:[0,0.6,0.1],n:1500,dir:[0,1.3,0]}); } },\n        { name:'Патрубки', desc:'Два штуцера: вход газа из трубы и выход к приборам. Обычно сверху.', build:(P,D)=>{ this.eCyl(P,D,{r:0.13,h:0.4,axis:'y',c:[-0.35,0.75,-0.1],n:700,dir:[0,1.4,0]}); this.eCyl(P,D,{r:0 еззараживает и подаёт в город под напором. Запустите тур по цепочке водоподготовки.', parts:[\n        station('Водозаборная скважина / ввод','Отсюда вода поступает на станцию — из скважины или магистрального водовода.', (P,D)=>{ this.eCyl(P,D,{r:0.2,h:2.0,axis:'y',c:[-5,0.0,2],n:2400,dir:[0,0,0]}); }),\n        station('Насосные агрегаты','Создают напор, проталкивая воду через очистку и дальше в городскую сеть.', (P,D)=>{ this.fPump(P,D,[-2.2,0.5,0.6],1500,[0,0,0]); this.fPump(P,D,[-2.2,0.5,-0.2],1500,[0,0,0]); this.fPump(P,D,[-2.2,0.5,-1.0],1500,[0,0,0]); }),\n        station('Фильтры очистки','Удаляют из воды песок, муть и железо, делая её прозрачной.', (P,D)=>{ this.fTankV(P,D,[0.6,1.0,1.4],0.45,1.8,2600,[0,0,0]); this.fTankV(P,D,[1.5,1.0,1.4],0.45,1.8,2600,[0,0,0]); }),\n        station('Резервуары чистой воды','Хранят запас уже очищенной воды на случай пикового разбора и аварий.', (P,D)=>{ this.fTankV(P,D,[2.8,0.9,-1.2],0.8,1.5,3500,[0,0,0]); }),\n        station('Станция обеззараживания','Обеззараживает воду (УФ-лампы или хлор), уничтожая бактерии перед подачей людям.', (P,D)=>{ this.fBldg(P,D,[4.4,0.8,1.2],1.0,1.4,0.8,2600,[0,0,0]); }, 5),\n        station('Водонапорная башня','Поддерживает постоянный напор в сети и сглаживает колебания разбора воды.', (P,D)=>{ this.fStack(P,D,[5.2,1.2,-2.4],0.18,2.6,1400,[0,0,0]); this.fTankV(P,D,[5.2,2.7,-2.4],0.7,1.0,2200,[0,0,0]); }, 8),\n        station('Щит управления и приводы','Частотные приводы плавно регулируют насосы, поддерживая ровное давление в городе.', (P,D)=>{ this.fBldg(P,D,[-4,0.8,-2],0.5,1.5,0.9,2000,[0,0,0]); }),\n      ]},\n      { cat:F, facility:true, name:'Очистные сооружения', intro:'Очистка сточных вод', cam:{r:17,ty:0.8,max:32}, ring:{y:-0.4,s:3.8}, tour:true, summary:'Стоки города проходят ступени очистки и возвращаются в водоём чистыми. Запустите тур — он ведёт по пути воды от решёток до сброса.', parts:[\n        station('Приёмная камера и решётки','Сюда приходят стоки. Решётки задерживают круп n('Система охлаждения','Радиаторы сбрасывают избыток тепла двигателей, который не пошёл в теплосеть.', (P,D)=>{ this.fBldg(P,D,[1.0,0.9,1.6],1.4,1.0,0.4,2200,[0,0,0]); }),\n        station('Силовой трансформатор','Повышает напряжение генераторов до сетевого, чтобы отдать электричество в город.', (P,D)=>{ this.fBldg(P,D,[3.4,0.6,0.8],1.0,0.9,0.9,2600,[0,0,0]); }),\n        station('Распределительное устройство','Шкафы и выключатели. Распределяют выработанную энергию и защищают линии.', (P,D)=>{ this.fBldg(P,D,[3.2,0.8,-1.8],1.4,1.5,0.6,2400,[0,0,0]); }),\n        station('Дымоходы','Отводят выхлоп двигателей в атмосферу после котла-утилизатора.', (P,D)=>{ this.fStack(P,D,[-3.5,1.4,-3],0.22,4.0,2200,[0,0,0]); this.fStack(P,D,[-2.7,1.4,-3],0.22,4.0,2200,[0,0,0]); }, 8),\n        station('Щит АСУ','Автоматика синхронизирует генераторы с сетью и управляет всей станцией.', (P,D)=>{ this.fBldg(P,D,[-1,0.8,-2.8],0.5,1.5,0.9,2000,[0,0,0]); }),\n      ]},\n    ];\n  }\n\n  get vShader(){ return `\n    uniform float uTime,uProgress,uExplode,uSelected;\n    attribute vec3 aScatter,aExplode,aRGB; attribute float aPart,aSeed;\n    varying float vSel,vSeed,vY,vRing,vReal,vWY;\n    varying vec3 vRGB;\n    void main(){\n      vSeed=aSeed; vRing=step(50.0,aPart);\n      vReal = aRGB.r < 0.0 ? 0.0 : 1.0; vRGB = aRGB;\n      vSel=(uSelected>=0.0 && abs(aPart-uSelected)<0.5)?1.0:0.0;\n      vec3 formed=position+aExplode*uExplode;\n      formed+=0.006*vec3(sin(uTime*1.3+aSeed*30.0),sin(uTime*1.7+aSeed*47.0),cos(uTime*1.1+aSeed*22.0));\n      vec3 pos=mix(aScatter,formed,smoothstep(0.0,1.0,uProgress));\n      vY=formed.y;\n      vWY=(modelMatrix*vec4(pos,1.0)).y;\n      gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);\n    }`; }\n  get fShader(){ return `\n    uniform float uTime,uSelected,uScan,uGround; uniform vec3 uColor,uColor2;\n    varying float vSel,vSeed,vY,vRing,vReal,vWY;\n    varying vec3 vRGB;\n    void main(){\n      float fl=0.82+0.18*sin(uTime*5.0+vSeed*40.0);\n      float band=smoothstep(0.18,0.0,abs(vY-uScan));\n      vec3 col=mix(uColor,uColor2,clamp(vSeed,0.0,1.0)*0.3);\n      col+=band*0.85;\n      if(vReal>0.5){ col = vRGB*(1.4+0.12*vSeed) + band*0.12; }\n      col=mix(col,vec3(1.0),vSel*0.65);\n      float dim=1.0; if(uSelected>=0.0 && vRing<0.5){ dim=vSel>0.5?1.0:0.16; }\n      float a=fl*dim*(0.5+vSel*0.65+band*0.55);\n      if(vRing>0.5){ a*=0.4; }\n      if(vReal>0.5){ a*=1.1; }\n      #ifdef REFL\n        a*=0.17*smoothstep(uGround-3.5,uGround,vWY);\n      #endif\n      gl_FragColor=vec4(col,a);\n    }`; }\n\n  renderVals(){\n    const di=this.state.deviceIndex, dev=this.devices[di], sel=this.state.selected;\n    const isFac=!!dev.facility, touring=this.state.tourActive, dens=this.state.density;\n    const N=this.devices.length;\n\n    const ctrlBase=\"cursor:pointer;font:600 12.5px 'IBM Plex Mono',monospace;letter-spacing:.02em;border-radius:9px;padding:9px 14px;backdrop-filter:blur(8px);\";\n    const ctrlA=ctrlBase+\"color:#03161e;background:rgba(56,232,255,0.92);border:1px solid rgba(56,232,255,0.92);\";\n    const ctrlN=ctrlBase+\"color:#dff6ff;background:rgba(6,18,30,0.6);border:1px solid rgba(56,232,255,0.3);\";\n    const ctrlM=ctrlBase+\"color:#9fc6d8;background:rgba(6,18,30,0.45);border:1px solid rgba(56,232,255,0.16);\";\n    let controls=[{label:'☰  Каталог', style:ctrlN, onClick:this.openCatalog}];\n    if(isFac){\n      if(touring){\n        controls.push({label:'‹  Назад', style:ctrlM, onClick:()=>this.tourStep(-1)});\n        controls.push({label:'Далее  ›', style:ctrlA, onClick:()=>this.tourStep(1)});\n        controls.push({label:'Завершить тур', style:ctrlM, onClick:this.exitTour});\n      } else {\n        controls.push({label:'▶  Запустить тур', style:ctrlA, onClick:this.startTour});\n        controls.push({label:'↺  Обзор', style:ctrlM, onClick:this.resetView});\n      }\n    } else {\n      controls.push({label:this.state.exploded?'⊞  Собрать':'⊟  Разобрать', style:ctrlN, onClick:this.toggleExplode});\n      controls.push({label:'↺  Сбросить', style:ctrlM, onClick:this.resetView});\n    }\n\n    const dBtn=(k,l)=>{ const a=dens===k; return {label:l, onClick:()=>this.setDensity(k), style:`cursor:pointer;font:600 11px 'IBM Plex Mono',monospace;padding:6px 11px;border-radius:6px;border:none;white-space:nowrap;background:${a?'rgba(56,232,255,0.9)':'transparent'};color:${a?'#03161e':'#9fc6d8'};`}; };\n    const densBtns=[dBtn('low','Низкая'),dBtn('med','Средняя'),dBtn('high','Высокая')];\n\n    const partStyle=a=>`display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;font:500 13.5px 'IBM Plex Sans',sans-serif;padding:9px 11px;border-radius:10px;transition:all .15s;border:1px solid ${a?'rgba(56,232,255,0.55)':'rgba(56,232,255,0.10)'};background:${a?'rgba(56,232,255,0.13)':'rgba(255,255,255,0.015)'};color:${a?'#eafaff':'#a6cddd'};`;\n    const numStyle=a=>`flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;font:600 11px 'IBM Plex Mono',monospace;background:${a?'rgba(56,232,255,0.9)':'rgba(56,232,255,0.12)'};color:${a?'#03161e':'#7fd6ec'};`;\n    const parts=dev.parts.map((p,i)=>({ name:p.name, num:String(i+1).padStart(2,'0'), style:partStyle(i===sel), numStyle:numStyle(i===sel), onClick:()=>this.selectPart(i) }));\n\n    const selected=sel>=0;\n    let infoTag, infoTitle, infoDesc;\n    if(isFac && touring && selected){ infoTag=`ШАГ ${sel+1} / ${dev.parts.length}`; infoTitle=dev.parts[sel].name; infoDesc=dev.parts[sel].desc; }\n    else if(selected){ infoTag=isFac?'ОБЪЕКТ':'ДЕТАЛЬ'; infoTitle=dev.parts[sel].name; infoDesc=dev.parts[sel].desc; }\n    else { infoTag='ОБЗОР'; infoTitle=dev.name; infoDesc=dev.summary; }\n\n    const q=(this.state.query||'').trim().toLowerCase();\n    const cats=['Приборы учёта','Запорная арматура','Насосное оборудование','Теплоснабжение','Водоснабжение и канализация','Электроснабжение','Коммунальная техника','Комплексные объекты'];\n    const itemStyle=a=>`display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;padding:11px 13px;border-radius:11px;transition:all .12s;border:1px solid ${a?'rgba(56,232,255,0.6)':'rgba(56,232,255,0.12)'};background:${a?'rgba(56,232,255,0.12)':'rgba(255,255,255,0.02)'};`;\n    const dotStyle=(fac)=>`flex:none;width:9px;height:9px;border-radius:${fac?'2px':'50%'};background:${fac?'#ffd27f':'#7fe6ff'};box-shadow:0 0 8px ${fac?'rgba(255,210,127,0.7)':'rgba(127,230,255,0.7)'};`;\n    const groups=[]; let matchCount=0;\n    cats.forEach(cat=>{\n      const items=[];\n      this.devices.forEach((d,gi)=>{ if(d.cat!==cat) return; if(q && !(d.name.toLowerCase().includes(q)||(d.intro||'').toLowerCase().includes(q))) return; matchCount++; items.push({ name:d.name, intro:d.intro||'', style:itemStyle(gi===di), dotStyle:dotStyle(d.facility), onClick:()=>this.selectDevice(gi) }); });\n      if(items.length) groups.push({ title:cat, count:items.length+' шт.', items });\n    });\n\n    return {\n      onCanvas:this.onCanvas, onLabels:this.onLabels, onTooltip:this.onTooltip,\n      brand:'ЖКХ · ИНТЕРАКТИВНАЯ ГОЛОГРАММА',\n      catLabel:dev.cat||'',\n      deviceName:dev.name, deviceIntro:dev.intro,\n      controls, densBtns,\n      listHeader:isFac?'ОБЪЕКТЫ НА ПЛОЩАДКЕ':'СОСТАВ',\n      parts, infoTag, infoTitle, infoDesc,\n      prev:this.prev, next:this.next,\n      counter:`${di+1} / ${N}`,\n      hint:isFac?'Тяните — поворот · колесо — масштаб · тур или выбор объекта':'Тяните — поворот · колесо — масштаб · клик по детали',\n      catalogOpen:this.state.catalogOpen, closeCatalog:this.closeCatalog,\n      query:this.state.query, onSearch:this.onSearch,\n      groups, noResults:groups.length===0,\n      totalLabel:`${N} объектов`,\n      notReady: !this.state.ready && !this.state.errored,\n      errored: this.state.errored,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
